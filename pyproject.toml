[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routewitness"
version = "0.1.0"
description = "Local-first network incident recorder for intermittent connectivity failures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "t1ktakdev"}]
keywords = ["networking", "diagnostics", "monitoring", "troubleshooting", "cli"]
dependencies = ["psutil>=5.9.8,<8", "dnspython>=2.6.1,<3", "pydantic>=2.8,<3", "platformdirs>=4,<5"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent", "Topic :: System :: Networking :: Monitoring"]

[project.urls]
Repository = "https://github.com/t1ktakdev/RouteWitness"
Issues = "https://github.com/t1ktakdev/RouteWitness/issues"

[project.scripts]
routewitness = "routewitness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "mypy>=1.15,<3", "types-psutil>=5.9", "build>=1,<2", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routewitness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/routewitness"]

[tool.coverage.run]
branch = true
source = ["routewitness"]

[tool.coverage.report]
show_missing = true
